// Giftrauch außerhalb des Felds: Wolken einmal vorrendern und pro Bild nur verschieben, damit die Bühne flüssig bleibt.
function cloudSprite(rgb) {
  const c = document.createElement("canvas");
  c.width = c.height = 160;
  const g = c.getContext("2d");
  // Mehrere weiche Kleckse statt eines Kreises, sonst sieht es nach Lichtfleck statt nach Qualm aus.
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = i ? 10 + 16 * Math.random() : 0;
    const x = 80 + Math.cos(a) * d;
    const y = 80 + Math.sin(a) * d;
    const r = 32 + 18 * Math.random();
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${rgb},0.34)`);
    grad.addColorStop(0.6, `rgba(${rgb},0.14)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 160, 160);
  }
  return c;
}
const CLOUDS = ["150,40,230", "110,25,180", "190,70,255", "90,10,140", "170,50,210", "140,255,70"].map(cloudSprite);
const ACID = CLOUDS.length - 1;
const SMOKE = Array.from({ length: 64 }, (_, i) => ({
  u: Math.random(), out: Math.random(), size: 0.8 + 0.9 * Math.random(),

  sprite: i % 9 === 0 ? ACID : i % ACID,
}));
// Einzelne Schwaden, die ?ber den Rand ins Feld kriechen und wieder zur?ckweichen.
const WISPS = Array.from({ length: 22 }, (_, i) => ({
  u: Math.random(), size: 0.5 + 0.5 * Math.random(),
  drift: (Math.random() < 0.5 ? -1 : 1) * (0.003 + 0.006 * Math.random()),
  phase: Math.random() * Math.PI * 2, speed: 0.25 + 0.3 * Math.random(),

}));
let smokeT = 0;
const smokeLayer = document.createElement("canvas");
const sctx = smokeLayer.getContext("2d");
// Halbe Aufl?sung reicht f?r weichen Qualm und halbiert die Arbeit pro Bild.
const SMOKE_RES = 0.5;
const SMOKE_BLEED = 60;

// Punkt auf dem Feldrand plus Normale nach au?en; u l?uft einmal ringsum von 0 bis 1.
function edgePoint(w, h, u) {
  let d = (((u % 1) + 1) % 1) * 2 * (w + h);
  if (d < w) return [d, 0, 0, -1];
  d -= w;
  if (d < h) return [w, d, 1, 0];
  d -= h;
  if (d < w) return [w - d, h, 0, 1];
  d -= w;
  return [0, h - d, -1, 0];
}

function puff(g, v, sprite, x, y, r, angle, alpha, add) {
  const [cx, cy] = toCanvas(v, [x, y]);
  g.save();
  g.globalCompositeOperation = add ? "lighter" : "source-over";
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  g.rotate(angle);
  g.drawImage(CLOUDS[sprite], -r, -r, 2 * r, 2 * r);
  g.restore();

function drawSmoke(v, f, now) {
  const p = f.pad || 0;
  const dt = Math.min(0.1, (now - smokeT) / 1000);

  const t = now / 1000;

  for (const c of SMOKE) {
    c.u += c.drift * dt;
    const [x, y, nx, ny] = edgePoint(f.w, f.h, c.u);
    const off = reach * (1.3 * c.out - 0.15 + 0.15 * Math.sin(t * 0.6 + c.phase));
    const r = c.size * reach * 1.4 * v.s * (1 + 0.12 * Math.sin(t * 0.9 + c.phase));
    puff(g, v, c.sprite, x + nx * off, y + ny * off, r, t * c.spin + c.phase,
      0.75 + 0.25 * Math.sin(t * 0.7 + 2 * c.phase), c.sprite === ACID);
  }
  // Feld weich und wellig aus dem Qualm radieren: keine gerade Kante, ?bergang ?ber Unsch?rfe.
  const n = 120;
  g.save();
  g.globalCompositeOperation = "destination-out";
  g.filter = `blur(${Math.max(2, 20 * v.s * k)}px)`;
  g.fillStyle = "#000";
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const u = i / n;
    const a = u * Math.PI * 2;
    const wave = 0.5 * Math.sin(a * 11 + t * 0.5) + 0.3 * Math.sin(a * 23 - t * 0.8 + 1.3)
      + 0.2 * Math.sin(a * 5 + t * 0.3 + 2);
    const ins = 16 + 30 * wave;
    const [x, y] = edgePoint(f.w, f.h, u);
    const [cx, cy] = toCanvas(v, [Math.min(Math.max(x, ins), f.w - ins), Math.min(Math.max(y, ins), f.h - ins)]);
    if (i) g.lineTo(cx, cy); else g.moveTo(cx, cy);
  }
  g.closePath();
  g.fill();
  g.restore();
  // Nach dem Radieren gezeichnet, damit sie halb durchsichtig ins Feld reichen d?rfen.
  for (const w of WISPS) {
    w.u += w.drift * dt;
    const [x, y, nx, ny] = edgePoint(f.w, f.h, w.u);
    const breath = 0.5 + 0.5 * Math.sin(t * w.speed + w.phase);
    const off = -reach * (0.05 + 0.4 * breath);
    const r = w.size * reach * 1.2 * v.s;
    puff(g, v, w.sprite, x + nx * off, y + ny * off, r, t * w.spin + w.phase, 0.3 + 0.35 * (1 - breath), false);
  }
  ctx.drawImage(smokeLayer, -SMOKE_BLEED, -SMOKE_BLEED, lw / k, lh / k);
}

function callout(text) {
  const el = $("callout");
  el.textContent = text;
  // Neu einhängen startet die Animation erneut.
  el.hidden = true;
  void el.offsetWidth;
  el.hidden = false;
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => { el.hidden = true; }, 2500);
}

function knockout(color) {
  const el = $("ko");
  koTimers.forEach(clearTimeout);
  // Farbe der ausgeschiedenen Seite; bei Doppel-K.O. die neutrale Vorlagenfarbe.
  if (color) { el.style.setProperty("--ko", color); el.style.setProperty("--ko-glow", color); }
  else { el.style.removeProperty("--ko"); el.style.removeProperty("--ko-glow"); }
  el.classList.remove("is-visible", "is-ending");
  void el.offsetWidth;
  el.classList.add("is-visible");
  koTimers = [
    setTimeout(() => el.classList.add("is-ending"), 2400),
    setTimeout(() => el.classList.remove("is-visible", "is-ending"), 2900),
  ];
}

// Zufälliger Platz im ganzen Bild: x/y vom Server sind Anteile des freien Raums, damit alle Bühnen
// dieselbe Stelle zeigen und das Meme samt Neigung bei jeder Fenstergröße komplett sichtbar bleibt.
function place(el, m) {
  const w = el.offsetWidth;
  const h = el.offsetHeight;
  const a = Math.abs(m.tilt) * Math.PI / 180;
  const dx = (w * Math.cos(a) + h * Math.sin(a) - w) / 2;
  const dy = (w * Math.sin(a) + h * Math.cos(a) - h) / 2;
  const box = $("media");
  el.style.left = `${dx + m.x * Math.max(0, box.clientWidth - w - 2 * dx)}px`;
  el.style.top = `${dy + m.y * Math.max(0, box.clientHeight - h - 2 * dy)}px`;
  el.classList.add("shown");
}
addEventListener("resize", () => playing.forEach((p) => p.el.isConnected && place(p.el, p.m)));

function seek(el, seconds) {
  if (Math.abs(el.currentTime - seconds) > 0.5) el.currentTime = seconds;
}

function play(el) {
  // Browser blockieren Ton ohne vorherigen Klick auf der Seite; dann bleibt es eben still.
  el.play().catch(() => { el.muted = true; el.play().catch(() => {}); });
}

function startMedia(m) {
  const kind = m.media.mime.split("/")[0];
  let el;
  const end = () => {
    if (!playing.has(m.id)) return;
    finished.add(m.id);
    removeMedia(m.id);
    act("cue", { kind: "ended", id: m.id });
  };
  if (kind === "audio") {
    el = new Audio(mediaUrl(m.media.url));
    el.volume = 0.9;
  } else {
    el = document.createElement(kind === "video" ? "video" : "img");
    el.style.setProperty("--tilt", `${m.tilt}deg`);
    if (m.media.cutout) el.classList.add("cutout");
    if (kind === "video") el.playsInline = true;
    // Erst mit bekannter Größe platzieren, sonst rechnet place() mit 300×150 Platzhaltermaßen.
    const ready = () => place(el, playing.get(m.id)?.m || m);
    if (kind === "video") el.onloadedmetadata = ready;
    else el.onload = ready;
    el.src = mediaUrl(m.media.url);
    $("media").append(el);
  }
  if (kind !== "image") {
    // Später geöffnete Bühne steigt an der laufenden Stelle ein.
    if (m.played > 0.5) el.addEventListener("loadedmetadata", () => seek(el, m.played), { once: true });
    if (!m.paused) play(el);
  }
  el.onended = end;
  el.onerror = end;
  playing.set(m.id, { el, m, kind });
}

function removeMedia(id) {
  const p = playing.get(id);
  if (!p) return;
  p.el.pause?.();
  p.el.remove();
  playing.delete(id);
}

function syncMedia(list = []) {
  const ids = new Set(list.map((m) => m.id));
  [...playing.keys()].filter((id) => !ids.has(id)).forEach(removeMedia);
  for (const m of list) {
    if (finished.has(m.id)) continue;
    const p = playing.get(m.id);
    if (!p) { startMedia(m); continue; }
    if (p.m.paused !== m.paused && p.kind !== "image") {
      // Beim Umschalten auf die Serverzeit gehen, damit mehrere Bühnen nicht auseinanderlaufen.
      seek(p.el, m.played);
      if (m.paused) p.el.pause(); else play(p.el);
    }
    p.m = m;
  }
}

// Mitte zwischen den nächstgelegenen Umrisspunkten: dort berühren sich die Roboter wirklich, nicht zwischen den Schwerpunkten.
function contactPoint(robots) {
  const [a, b] = robots.filter((r) => r.contour.length);
  if (!a || !b) return null;
  let best = Infinity, pos = null;
  for (const p of a.contour) {
    for (const q of b.contour) {
      const d = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;
      if (d < best) { best = d; pos = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    }
  }
  return pos;
}

function sparks() {
  return Array.from({ length: 22 }, () => ({
    a: Math.random() * Math.PI * 2,
    v: 0.5 + Math.random() * 0.5,
    hot: Math.random() < 0.6,
  }));
}

function ingest(s) {
  if (s.battle !== battle) {
    // Neuer Kampf: Ereignis-IDs fangen neu an, alte Effekte verwerfen.
    battle = s.battle;
    lastEvent = Math.max(0, ...s.events.map((e) => e.id));
    effects = [];
    $("callout").hidden = true;
    return;
  }
  const now = performance.now();
  for (const e of s.events) {
    if (e.id <= lastEvent) continue;
    lastEvent = e.id;
    if (e.type === "collision") {
      // Bei gleich starkem Treffer kommen zwei Ereignisse für denselben Aufprall; nur eine Explosion zeigen.
      if (now - lastCrash > 300) {
        lastCrash = now;
        const pos = contactPoint(s.robots) || e.pos;
        effects.push({ kind: "crash", pos, t0: now, sparks: sparks() });
      }
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `-${Math.round(e.amount)}`, color: COLORS[e.player], dy: e.player === 1 ? -30 : 30 });
      shake = Math.max(shake, 12);
    } else if (e.type === "obstacle") {
      effects.push({ kind: "boom", pos: e.pos, t0: now, big: true });
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `-${Math.round(e.amount)}`, color: COLORS[e.player], dy: e.player === 1 ? -30 : 30 });
      shake = Math.max(shake, 18);
    } else if (e.type === "powerup") {
      effects.push({ kind: "ring", pos: e.pos, t0: now, color: "#3fff8a" });
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `+${Math.round(e.amount)}`, color: "#3fff8a", dy: -30 });
    } else if (e.type === "spawn") {
      effects.push({ kind: "ring", pos: e.pos, t0: now, color: e.kind === "obstacle" ? "#ff5c33" : "#3fff8a" });
    } else if (e.type === "ko") {
      shake = 25;
      knockout(e.players.length === 1 ? COLORS[e.players[0]] : null);
    } else if (e.type === "ulti_aim") {
      callout("⚡ LASER-ULTI! ⚡");
    } else if (e.type === "ulti_fire") {
      effects.push({ kind: "beam", pos: e.from, to: e.at || e.to, hit: e.hit, t0: now, color: COLORS[e.player] });
      shake = Math.max(shake, e.hit ? 26 : 14);
      if (!e.hit) {
        effects.push({ kind: "boom", pos: e.to, t0: now });
        callout("DANEBEN!");
      }
    } else if (e.type === "ulti") {
      effects.push({ kind: "crash", pos: e.pos, t0: now, sparks: sparks() });
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `-${Math.round(e.amount)}`, color: COLORS[e.player], dy: -40 });
    } else if (e.type === "shrink") {
      callout("ARENA SCHRUMPFT!");
    } else if (e.type === "ringout_ko") {
      callout("RAUSGEFALLEN!");
      shake = 25;
    }
  }
}

function drawRobot(v, r, t) {
  if (!r.contour.length) return;
  const color = COLORS[r.id];
  ctx.save();
  pathPoly(ctx, v, r.contour);
  ctx.shadowColor = color;
  ctx.shadowBlur = 25 + 10 * Math.sin(t / 200);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.globalAlpha = r.present ? 1 : 0.35;
  ctx.stroke();
  ctx.restore();
  if (r.outside && Math.floor(t / 250) % 2 === 0) {
    pathPoly(ctx, v, r.contour);
    ctx.strokeStyle = "#ff1e3c";
    ctx.lineWidth = 7;
    ctx.lineJoin = "round";
    ctx.stroke();
  }
  if (r.center) {
    const [x, y] = toCanvas(v, r.center);
    label(r.name, x, y - 12, color, 18);
  }
}

function label(text, x, y, color, size) {
  ctx.font = `900 ${size}px Inter, Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#000";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// Form pro Hindernis-ID festhalten, sonst w?rde der Fels jedes Bild anders aussehen.
const rockShapes = new Map();
function rockShape(id) {
  if (!rockShapes.has(id)) {
    let seed = (id * 9301 + 49297) % 233280;
    const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    const boulder = (cx, cy, s) => {
      const n = 13 + Math.floor(rnd() * 5);
      const pts = Array.from({ length: n }, (_, i) => {
        const a = (i / n) * Math.PI * 2 + (rnd() - 0.5) * 0.3;
        // Unregelm??ige Kerben ergeben Zacken statt eines runden Kiesels oder eines Zahnrads.
        const k = (0.8 + rnd() * 0.22) * (rnd() < 0.35 ? 0.8 : 1);
        return [Math.cos(a) * k, Math.sin(a) * k * 0.86];
      });
      const apex = [-0.16 + (rnd() - 0.5) * 0.12, -0.3 + (rnd() - 0.5) * 0.1];
      const tones = pts.map(() => (rnd() - 0.5) * 0.14);
      const cracks = Array.from({ length: 2 + Math.floor(rnd() * 2) }, () => {
        let [px, py] = pts[Math.floor(rnd() * n)];
        const line = [[px * 1.05, py * 1.05]];
        for (let j = 0; j < 3; j++) {
          px = px * 0.62 + (rnd() - 0.5) * 0.22;
          py = py * 0.62 + (rnd() - 0.5) * 0.22;
          line.push([px, py]);
        }
        const [bx, by] = line[1];
        return { line, branch: [[bx, by], [bx + (rnd() - 0.5) * 0.4, by + (rnd() - 0.5) * 0.4]] };
      });
      return { cx, cy, s, pts, apex, tones, cracks };
    };
    const main = boulder(0, -0.04, 1);
    const sides = Array.from({ length: 2 + Math.floor(rnd() * 2) }, (_, i) => {
      const a = Math.PI * (0.15 + i * 0.7 + rnd() * 0.35);
      return boulder(Math.cos(a) * 0.78, Math.sin(a) * 0.62, 0.3 + rnd() * 0.16);
    });
    const rubble = Array.from({ length: 6 }, () => {
      const a = rnd() * Math.PI * 2;
      return [Math.cos(a) * (0.95 + rnd() * 0.2), Math.sin(a) * (0.8 + rnd() * 0.15), 0.04 + rnd() * 0.05, rnd() * 6];
    });
    // Hintere Brocken vor dem Hauptfelsen zeichnen, vordere danach: wirkt wie eine Formation mit Tiefe.
    rockShapes.set(id, { boulders: [...sides.filter((b) => b.cy < 0), main, ...sides.filter((b) => b.cy >= 0)], rubble });
  }
  return rockShapes.get(id);
}

const LIGHT = [-0.55, -0.83];
const shadeRock = (k) => {
  const c = (lo, hi) => Math.round(lo + (hi - lo) * Math.min(1, Math.max(0, k)));
  return `rgb(${c(34, 212)},${c(28, 198)},${c(25, 182)})`;
};

function paintBoulder(g, ox, oy, r, b) {
  const S = r * b.s;
  const P = ([px, py]) => [ox + (b.cx + px * b.s) * r, oy + (b.cy + py * b.s) * r];
  const apex = P(b.apex);
  const outline = () => {
    g.beginPath();
    b.pts.forEach((p, i) => (i ? g.lineTo(...P(p)) : g.moveTo(...P(p))));
    g.closePath();
  };
  outline();
  g.fillStyle = shadeRock(0.35);
  g.fill();
  g.save();
  outline();
  g.clip();
  // Jede Facette bekommt Licht nach ihrer Blickrichtung: das macht aus der Fl?che einen kantigen Block.
  b.pts.forEach((p, i) => {
    const q = b.pts[(i + 1) % b.pts.length];
    const mx = (p[0] + q[0]) / 2 - b.apex[0], my = (p[1] + q[1]) / 2 - b.apex[1];
    const d = (mx * LIGHT[0] + my * LIGHT[1]) / (Math.hypot(mx, my) || 1);
    g.fillStyle = shadeRock(0.55 + d * 0.38 + b.tones[i]);
    g.beginPath();
    g.moveTo(...apex);
    g.lineTo(...P([p[0] * 1.02, p[1] * 1.02]));
    g.lineTo(...P([q[0] * 1.02, q[1] * 1.02]));
    g.closePath();
    g.fill();
  });
  g.strokeStyle = "rgba(15,10,8,0.35)";
  g.lineWidth = Math.max(1, S * 0.018);
  b.pts.forEach((p, i) => {
    if (i % 3) return;
    g.beginPath(); g.moveTo(...apex); g.lineTo(...P(p)); g.stroke();
  });
  const ao = g.createLinearGradient(0, oy + (b.cy - 0.2 * b.s) * r, 0, oy + (b.cy + 0.9 * b.s) * r);
  ao.addColorStop(0, "rgba(0,0,0,0)");
  ao.addColorStop(1, "rgba(0,0,0,0.35)");
  g.fillStyle = ao;
  g.fillRect(ox - 2 * r, oy - 2 * r, 4 * r, 4 * r);
  g.lineCap = "round";
  g.lineJoin = "miter";
  for (const { line, branch } of b.cracks) {
    for (const [path, w] of [[line, 0.05], [branch, 0.03]]) {
      // Heller Rand unter dem Riss gibt ihm Tiefe, statt nur eine schwarze Linie zu sein.
      g.strokeStyle = "rgba(235,222,205,0.35)";
      g.lineWidth = Math.max(1, S * w * 0.6);
      g.beginPath();
      path.forEach((pt, i) => { const [px, py] = P(pt); i ? g.lineTo(px + 1.5, py + 1.5) : g.moveTo(px + 1.5, py + 1.5); });
      g.stroke();
      g.strokeStyle = "rgba(12,8,6,0.9)";
      g.lineWidth = Math.max(1.5, S * w);
      g.beginPath();
      path.forEach((pt, i) => (i ? g.lineTo(...P(pt)) : g.moveTo(...P(pt))));
      g.stroke();
    }
  }
  g.restore();
  outline();
  g.strokeStyle = "#0b0807";
  g.lineWidth = Math.max(2.5, S * 0.06);
  g.lineJoin = "miter";
  g.miterLimit = 6;
  g.stroke();
}

// Fels einmal pro Gr??e vorzeichnen: spart Arbeit pro Bild und vermeidet Nahtlinien beim Blinken.
const rockSprites = new Map();
function rockSprite(id, r) {
  const hit = rockSprites.get(id);
  if (hit && Math.abs(hit.r - r) < 1) return hit.canvas;
  if (rockSprites.size > 16) rockSprites.clear();
  const half = Math.ceil(r * 1.4);
  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = half * 2;
  const g = sprite.getContext("2d");
  const { boulders, rubble } = rockShape(id);
  for (const [px, py, s, a] of rubble) {
    g.beginPath();
    for (let i = 0; i < 3; i++) {
      const ang = a + (i / 3) * Math.PI * 2;
      g.lineTo(half + (px + Math.cos(ang) * s) * r, half + (py + Math.sin(ang) * s) * r);
    }
    g.closePath();
    g.fillStyle = shadeRock(0.3);
    g.fill();
    g.strokeStyle = "#0b0807";
    g.lineWidth = Math.max(1.5, r * 0.02);
    g.stroke();
  }
  for (const b of boulders) paintBoulder(g, half, half, r, b);
  rockSprites.set(id, { r, canvas: sprite });
  return sprite;
}

function drawRock(x, y, r, item, t) {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(x + r * 0.15, y + r * 0.72, r * 1.15, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
  const sprite = rockSprite(item.id, r);
  // Rotes Gl?hen h?lt die Gefahr sichtbar, sobald der Fels trifft.
  if (item.armed) { ctx.shadowColor = "#ff3b1f"; ctx.shadowBlur = 20 + 10 * Math.sin(t / 200); }
  ctx.drawImage(sprite, x - sprite.width / 2, y - sprite.height / 2);
  ctx.shadowBlur = 0;
}

function drawItem(v, item, t) {
  const [x, y] = toCanvas(v, item.center);
  ctx.save();
  if (item.kind === "obstacle") {
    const [ex, ey] = toCanvas(v, item.poly[0]);
    const r = Math.hypot(ex - x, ey - y);
    if (!item.armed) {
      // Blinkt, solange es noch nicht scharf ist, damit niemand unfair getroffen wird.
      ctx.strokeStyle = "#ff9e1f";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      pathPoly(ctx, v, item.poly);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = Math.floor(t / 120) % 2 === 0 ? 0.75 : 0.3;
    }
    drawRock(x, y, r, item, t);
  } else {
    const pulse = 1 + 0.08 * Math.sin(t / 150);
    ctx.translate(x, y);
    ctx.scale(pulse, pulse);
    ctx.translate(-x, -y);
    pathPoly(ctx, v, item.poly);
    ctx.shadowColor = "#3fff8a";
    ctx.shadowBlur = 30;
    ctx.fillStyle = "#3fff8a55";
    ctx.fill();
    ctx.strokeStyle = "#3fff8a";
    ctx.lineWidth = 3;
    ctx.stroke();
    label("✚", x, y + 12, "#fff", 34);
  }
  ctx.restore();
  if (item.ttl < 3) label(item.ttl.toFixed(0), x, y - 40, "#fff", 16);
}

function drawCrash(x, y, k, s, list) {
  const ease = 1 - (1 - k) ** 3;
  const fade = 1 - k;
  ctx.globalCompositeOperation = "lighter";
  if (k < 0.15) {
    const f = 1 - k / 0.15;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 160 * s + 40);
    g.addColorStop(0, `rgba(255,255,255,${f})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 160 * s + 40, 0, Math.PI * 2); ctx.fill();
  }
  const r = (25 + 85 * ease) * s + 8;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,250,200,${fade})`);
  g.addColorStop(0.35, `rgba(255,170,40,${0.9 * fade})`);
  g.addColorStop(0.7, `rgba(255,60,20,${0.6 * fade})`);
  g.addColorStop(1, "rgba(120,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(255,220,150,${fade})`;
  ctx.lineWidth = 8 * fade + 1;
  ctx.beginPath(); ctx.arc(x, y, (30 + 170 * ease) * s + 10, 0, Math.PI * 2); ctx.stroke();
  ctx.lineCap = "round";
  for (const p of list) {
    const d0 = (20 + 200 * p.v * ease) * s;
    const d1 = d0 + (14 + 30 * p.v) * s * fade + 2;
    ctx.strokeStyle = p.hot ? `rgba(255,230,120,${fade})` : `rgba(255,110,30,${fade})`;
    ctx.lineWidth = (p.hot ? 4 : 3) * fade + 1;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(p.a) * d0, y + Math.sin(p.a) * d0);
    ctx.lineTo(x + Math.cos(p.a) * d1, y + Math.sin(p.a) * d1);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

// Zielphase: Linie steht fest und wird immer greller, damit der Gegner sieht, wohin er ausweichen muss.
function drawAim(v, shot, now) {
  const [x0, y0] = toCanvas(v, shot.from);
  const [x1, y1] = toCanvas(v, shot.to);
  const k = Math.max(0, Math.min(1, 1 - shot.left / (shot.aim || 1)));
  const color = COLORS[shot.player];
  ctx.save();
  ctx.lineCap = "round";
  ctx.shadowColor = color;
  ctx.shadowBlur = 10 + 20 * k;
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.45 + 0.4 * k + 0.15 * Math.sin(now / (60 - 35 * k));
  ctx.lineWidth = 2 + 3 * k;
  ctx.setLineDash([18, 12]);
  ctx.lineDashOffset = -now / 12;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = "lighter";
  const r = (18 + 40 * k) * v.s + 6;
  const g = ctx.createRadialGradient(x0, y0, 0, x0, y0, r);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.4, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 50) ** 2;
  ctx.beginPath(); ctx.arc(x0, y0, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBeam(v, e, k) {
  if (k >= 1) return;
  const [x0, y0] = toCanvas(v, e.pos);
  const [x1, y1] = toCanvas(v, e.to);
  // Schnell voll da, langsam ausgedünnt: wirkt wie ein Schuss, nicht wie ein Balken.
  const w = (1 - k) ** 1.5;
  ctx.save();
  ctx.lineCap = "round";
  ctx.globalCompositeOperation = "lighter";
  for (const [width, color, blur] of [[70, e.color, 50], [34, e.color, 25], [12, "#ffffff", 12]]) {
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.globalAlpha = Math.min(1, 0.35 + w);
    ctx.lineWidth = width * w * v.s + 2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}

function drawEffects(v, now) {
  effects = effects.filter((e) => now - e.t0 < 1200 && e.pos);
  for (const e of effects) {
    const k = (now - e.t0) / 1200;
    const [x, y] = toCanvas(v, e.pos);
    ctx.save();
    if (e.kind === "beam") {
      drawBeam(v, e, (now - e.t0) / 700);
    } else if (e.kind === "crash") {
      // Kurz halten, damit die Roboter nach dem Aufprall gleich wieder zu sehen sind.
      const c = (now - e.t0) / 650;
      if (c < 1) drawCrash(x, y, c, v.s, e.sparks);
    } else if (e.kind === "boom") {
      const r = (e.big ? 140 : 90) * v.s * Math.sqrt(k) + 10;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,255,220,${1 - k})`);
      g.addColorStop(0.4, `rgba(255,160,40,${0.8 * (1 - k)})`);
      g.addColorStop(1, "rgba(255,40,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === "ring") {
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(x, y, 20 + 120 * k * v.s, 0, Math.PI * 2); ctx.stroke();
    } else if (e.kind === "text") {
      ctx.globalAlpha = 1 - k * k;
      label(e.text, x, y + e.dy - 60 * k, e.color, 44 + 10 * (1 - k));
    }
    ctx.restore();
  }
}

// Live-Ausschnitt jedes Roboters aus dem Kamerabild, damit der VS-Bildschirm ohne hochgeladene Fotos auskommt.
function drawPortraits(s) {
  const shapes = s.phase === "register"
    ? s.proposal.map((r) => [r.slot, r.contour])
    : s.robots.map((r) => [r.id, r.contour]);
  for (const id of [1, 2]) {
    const pc = $(`portrait${id}`);
    if (pc.hidden) continue;
    resizeCanvas(pc);
    const g = pc.getContext("2d");
    g.clearRect(0, 0, pc.width, pc.height);
    const contour = shapes.find(([i]) => i === id)?.[1];
    if (!frame || !contour?.length) {
      g.fillStyle = "#ffffff62";
      g.font = `900 ${Math.round(pc.width / 12)}px Inter, Arial, sans-serif`;
      g.textAlign = "center";
      g.fillText("ROBOTER", pc.width / 2, pc.height / 2);
      continue;
    }
    const p0 = s.frame.pad || 0;
    const k = frame.width / (s.frame.w + 2 * p0);
    const xs = contour.map((p) => p[0]);
    const ys = contour.map((p) => p[1]);
    const pad = 0.25 * Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
    const x0 = Math.max(0, Math.min(...xs) - pad);
    const y0 = Math.max(0, Math.min(...ys) - pad);
    const w = Math.min(s.frame.w, Math.max(...xs) + pad) - x0;
    const h = Math.min(s.frame.h, Math.max(...ys) + pad) - y0;
    const scale = Math.min(pc.width / w, pc.height / h);
    g.drawImage(frame, (x0 + p0) * k, (y0 + p0) * k, w * k, h * k,
      (pc.width - w * scale) / 2, (pc.height - h * scale) / 2, w * scale, h * scale);
  }
}

const PHASE_LABEL = { register: "BEREIT", intro: "GLEICH GEHT'S LOS", ready: "GLEICH GEHT'S LOS", countdown: "ACHTUNG",
  fight: "KAMPF", finished: "ENDE" };

function clock(sec) {
  const t = Math.floor(sec || 0);
  return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
}

function updateHud(s) {
  $("hud").hidden = !s.arena;
  [1, 2].forEach((id) => {
    const r = s.robots.find((o) => o.id === id);
    const el = $(`f${id}`);
    const max = r ? r.max_hp : s.balancing.start_hp;
    const hp = r ? Math.max(0, r.hp) : max;
    const pct = `calc(${Math.min(100, (100 * hp) / max)}% - 6px)`;
    el.querySelector(".name").textContent = r?.name || s.names?.[id - 1] || `Roboter ${id}`;
    el.querySelector(".fill").style.width = pct;
    el.querySelector(".trail").style.width = pct;
    el.querySelector(".hp-text").innerHTML = r?.outside
      ? `${Math.ceil(hp)} / ${max} HP<b>RINGOUT!</b>` : `${Math.ceil(hp)} / ${max} HP`;
    el.classList.toggle("low", hp / max < 0.25 && s.phase === "fight");
    const u = r?.ulti || { charge: 0, ready: false, used: false };
    const meter = el.querySelector(".ulti");
    meter.querySelector("i").style.width = `${u.used ? 0 : Math.round(100 * u.charge)}%`;
    meter.classList.toggle("ready", u.ready && s.phase === "fight");
    meter.classList.toggle("used", u.used);
  });
  $("timer").textContent = clock(s.elapsed);
  $("timerLabel").textContent = PHASE_LABEL[s.phase] || "SETUP";
  const winner = $("winner");
  winner.hidden = !s.finished;
  winner.textContent = s.winner ? `🏆 ${s.winner} gewinnt` : "Unentschieden";
  document.body.classList.toggle("hud-hidden", s.hud === false);
  $("vs").hidden = !s.vs;
  updateVs(s);
}

function updateVs(s) {
  [1, 2].forEach((id) => {
    const card = $(`card${id}`);
    const p = s.profiles?.[id - 1] || {};
    const photo = card.querySelector(".photo");
    // Ohne hochgeladenes Bild bleibt der Live-Ausschnitt aus dem Kamerabild.
    const image = mediaUrl(p.image) || null;
    if (photo.getAttribute("src") !== image) {
      if (image) photo.src = image; else photo.removeAttribute("src");
    }
    photo.hidden = !p.image;
    $(`portrait${id}`).hidden = Boolean(p.image);
    const fill = (cls, text) => {
      const el = card.querySelector(cls);
      el.textContent = text;
      el.hidden = !text;
    };
    fill(".vs-name", s.names?.[id - 1] || `Roboter ${id}`);
    fill(".team", p.team);
    fill(".specs", [p.weight && `Gewicht ${p.weight}`, p.height && `Höhe ${p.height}`].filter(Boolean).join(" · "));
    fill(".slogan", p.slogan);
  });
}

function updateIntro(s) {
  // Pro Kampf genau einmal; danach übernimmt der VS-Bildschirm bis zum Kampfbeginn.
  if (s.phase === "intro" && !s.vs && introBattle !== s.battle) {
    introBattle = s.battle;
    intro.hidden = false;
    intro.currentTime = 0;
    intro.muted = false;
    intro.volume = 1;
    // Ohne Klick auf der Seite verbietet der Browser Ton; dann eben stumm.
    intro.play().catch(() => { intro.muted = true; intro.play().catch(() => {}); });
  } else if ((s.phase !== "intro" || s.vs) && !intro.hidden) {
    intro.pause();
    intro.hidden = true;
  }
}
intro.addEventListener("ended", () => { intro.hidden = true; });
intro.addEventListener("error", () => { intro.hidden = true; });

let countText = "";
let lastPhase = null;
let fightUntil = 0;
function updateCountdown(s) {
  const now = performance.now();
  if (lastPhase === "countdown" && s.phase === "fight") fightUntil = now + 1200;
  lastPhase = s.phase;
  const text = s.phase === "countdown" ? String(Math.max(1, Math.ceil(s.countdown)))
    : now < fightUntil ? "FIGHT!" : "";
  if (text === countText) return;
  countText = text;
  const el = $("countdown");
  el.hidden = !text;
  if (!text) return;
  // Neues Element je Zahl, damit die Einflug-Animation jedes Mal neu startet.
  const span = document.createElement("span");
  span.textContent = text;
  el.replaceChildren(span);
}

function draw() {
  resizeCanvas(canvas);
  const now = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const online = now - lastPacket < 2000;
  const s = state;
  $("status").textContent = !online ? "APP OFFLINE"
    : s?.tracking?.fps ? `TRACKING ${s.tracking.fps} FPS · ${s.tracking.latency_ms} MS` : "APP VERBUNDEN";
  const ready = s?.frame?.kind === "arena" && frame;
  $("fallback").hidden = !!ready;
  if (!ready) {
    $("hint").textContent = !s?.frame || !frame
      ? s?.camera?.error || "Warte auf Kamera …"
      : "Kalibrierung · Arena in der Moderation festlegen";
    requestAnimationFrame(draw);
    return;
  }
  // Das Bild ist die entzerrte Arena plus Rand; Koordinaten bleiben aber Arena-Einheiten des Felds.
  const v = fit(canvas, s.frame);
  const rect = [[0, 0], [s.frame.w, 0], [s.frame.w, s.frame.h], [0, s.frame.h]];
  if (shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
  }
  ctx.imageSmoothingQuality = "high";
  drawFrame(ctx, v, s.frame, frame);
  drawSmoke(v, s.frame, now);
  if (s.zone) {
    // Alles zwischen Arenarand und erlaubtem Rechteck ist Sperrgebiet; dort tickt Ringout.
    ctx.save();
    pathPoly(ctx, v, rect);
    s.zone.forEach((p, i) => {
      const [x, y] = toCanvas(v, p);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = "#ff1e3c38";
    ctx.fill("evenodd");
    pathPoly(ctx, v, s.zone);
    ctx.shadowColor = "#ff1e3c";
    ctx.shadowBlur = 18 + 8 * Math.sin(now / 150);
    ctx.strokeStyle = "#ff4d6d";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();
  }
  // Schon vor dem Start zeigen, damit das Publikum sieht, wer wer ist.
  s.proposal.forEach((r) => {
    if (!r.contour.length) return;
    pathPoly(ctx, v, r.contour);
    ctx.strokeStyle = COLORS[r.slot];
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.stroke();
  });
  s.robots.forEach((r) => drawRobot(v, r, now));
  if (s.phase === "fight" || s.phase === "finished") {
    s.items.forEach((i) => drawItem(v, i, now));
    if (s.shot) drawAim(v, s.shot, now);
    drawEffects(v, now);
  }
  requestAnimationFrame(draw);
}

let previewDone = false;
function preview(s, bitmap) {
  // Ein Standbild genügt; sobald ein Kamerabild für die Live-Ausschnitte da ist, bleibt es stehen.
  if (previewDone) return;
  if (bitmap) { frame?.close?.(); frame = bitmap; }
  $("vs").hidden = false;
  updateVs(s);
  if (s.frame?.kind === "arena") drawPortraits(s);
  previewDone = Boolean(frame) || s.frame?.kind !== "arena";
}

if (PREVIEW) {
  document.body.classList.add("vs-preview");
  connect(preview);
} else {
  connect((s, bitmap) => {
    ingest(s);
    syncMedia(s.memes);
    state = s;
    lastPacket = performance.now();
    if (bitmap) { frame?.close?.(); frame = bitmap; }
    updateHud(s);
    updateIntro(s);
    updateCountdown(s);
    if (s.vs && s.frame?.kind === "arena") drawPortraits(s);
  });
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
