<!doctype html>
<!-- This code has been fully generated by an AI. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Der Client liefert die Seiten selbst aus; Spiel und Medien kommen vom Server aus der URL. -->
<base href="./">
<title>Hebocon – Spieler</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0e14; color: #d9e4f2; display: flex; flex-direction: column;
    font: 16px/1.4 "Segoe UI", system-ui, sans-serif; --c: #00e5ff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid #222a38; font-size: 13px; color: #8b98a9; }
  main { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px; }
  h1 { margin: 0; color: var(--c); font-size: clamp(26px, 8vw, 44px); text-transform: uppercase; letter-spacing: .04em;
    overflow-wrap: anywhere; }
  .slot { color: #8b98a9; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; }
  .hp-row { display: flex; justify-content: space-between; font-weight: 800; }
  .hp-bar { height: 18px; padding: 2px; background: #10131b; border: 2px solid #d9e4f2; }
  .hp-bar div { height: 100%; width: 100%; background: var(--c); transition: width .3s; }
  #phase { font-size: 22px; font-weight: 800; text-align: center; min-height: 1.4em; }
  #message { color: #8b98a9; text-align: center; min-height: 1.4em; }
  #ulti { --charge: 0%; flex: 1; min-height: 160px; border: 3px solid var(--c); color: #fff; font: 800 26px/1.2 inherit;
    background: linear-gradient(to top, color-mix(in srgb, var(--c) 45%, transparent) var(--charge), #10131b var(--charge));
    cursor: pointer; }
  #ulti:disabled { opacity: .45; cursor: not-allowed; }
  #ulti.ready:not(:disabled) { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 28px var(--c); } }
  #away { text-align: center; }
  #away button { font: 700 18px inherit; padding: 10px 18px; margin-top: 10px; cursor: pointer; }
  .bad { color: #f85149; }
</style>
</head>
<body>
<header>
  <span id="who">Spieler</span>
  <span id="conn" role="status">○ Server offline</span>
</header>
<main>
  <div>
    <div class="slot" id="slot"></div>
    <h1 id="name"></h1>
  </div>
  <section id="game">
    <div class="hp-row"><span>HP</span><span id="hp"></span></div>
    <div class="hp-bar"><div id="hpFill"></div></div>
  </section>
  <div id="phase" aria-live="polite"></div>
  <button id="ulti" type="button" disabled title="Laser-Ulti zünden (Leertaste)">⚡ LASER-ULTI</button>
  <div id="message" role="status"></div>
  <section id="away" hidden>
    <p>Du hast gerade keinen Spielerplatz.</p>
    <button id="rejoin" type="button">Wieder anmelden</button>
    <p id="rejoinError" class="bad"></p>
  </section>
</main>
<script type="module">
import { COLORS, HTTP, NAME, TOKEN, act, connect } from "./common.js";

const byId = (id) => document.getElementById(id);
const PHASE = {
  arena: "Spielfeld wird eingerichtet …", empty: "Spielfeld wird eingerichtet …",
  register: "Roboter werden erkannt …", intro: "Intro läuft", ready: "Gleich geht's los",
  fight: "KAMPF!", finished: "Kampf vorbei",
};
let state = null;
let slot = null;
let lastPacket = 0;

byId("ulti").onclick = fire;
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); fire(); }
});

async function fire() {
  if (byId("ulti").disabled) return;
  const r = await act("ulti", { player: slot });
  if (r && !r.ok && r.message) byId("message").textContent = r.message;
}

byId("rejoin").onclick = async () => {
  byId("rejoinError").textContent = "";
  try {
    const res = await fetch(`${HTTP}/lobby/join`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: NAME, token: TOKEN }),
    });
    const r = await res.json();
    if (!r.ok) { byId("rejoinError").textContent = r.message; return; }
    // Neues Token heißt neue Sitzung; die Seite muss es für Verbindung und Aktionen kennen.
    if (r.token !== TOKEN) {
      const params = new URLSearchParams(location.search);
      params.set("token", r.token);
      location.search = params.toString();
    }
  } catch {
    byId("rejoinError").textContent = "Server nicht erreichbar.";
  }
};

function ui(s) {
  const me = s.lobby?.players.find((p) => p.name.toLowerCase() === NAME.toLowerCase());
  slot = me ? me.slot : null;
  byId("away").hidden = Boolean(slot);
  byId("game").hidden = !slot;
  document.body.style.setProperty("--c", slot ? COLORS[slot] : "#8b98a9");
  byId("slot").textContent = slot ? `Spieler ${slot}` : "Kein Platz";
  byId("who").textContent = slot ? `Spieler ${slot}` : "Spieler";
  const robot = slot ? s.robots.find((r) => r.id === slot) : null;
  byId("name").textContent = robot?.name || (slot && s.names?.[slot - 1]) || me?.name || NAME;
  byId("hp").textContent = robot ? `${Math.ceil(robot.hp)} / ${robot.max_hp}` : "–";
  if (robot) {
    byId("hpFill").style.width = `${Math.min(100, (100 * Math.max(0, robot.hp)) / robot.max_hp)}%`;
  }
  const u = robot?.ulti || { charge: 0, ready: false, used: false };
  const btn = byId("ulti");
  btn.style.setProperty("--charge", `${Math.round(100 * u.charge)}%`);
  btn.classList.toggle("ready", u.ready);
  btn.disabled = !(slot && s.phase === "fight" && u.ready);
  btn.textContent = u.used ? "⚡ ULTI VERBRAUCHT" : u.ready ? "⚡ LASER-ULTI BEREIT" : `⚡ ULTI ${Math.round(100 * u.charge)} %`;

  byId("phase").textContent = s.phase === "countdown" ? String(Math.max(1, Math.ceil(s.countdown)))
    : s.phase === "finished" ? (s.winner ? `🏆 ${s.winner} gewinnt` : "Unentschieden")
    : PHASE[s.phase] || "";
  byId("message").textContent = s.message || "";
}

setInterval(() => {
  const online = performance.now() - lastPacket < 2000;
  byId("conn").textContent = online ? "● Server verbunden" : "○ Server offline";
}, 500);

connect((s) => {
  state = s;
  lastPacket = performance.now();
  ui(state);
}, {
  frames: false,
  onAuthLost: () => { byId("away").hidden = false; byId("rejoinError").textContent = "Anmeldung abgelaufen."; },
});
</script>
</body>
</html>
