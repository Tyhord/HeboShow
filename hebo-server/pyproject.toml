# This code has been fully generated by an AI.

[project]
name = "hebocon"
version = "2.0.0"
description = "Hebocon Battle Vision Server: Kamera, Tracking, Spiel und LAN-Schnittstelle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "torch>=2.6",
    "transformers>=4.57",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "timm>=1.0.30",
    "websockets>=17.4",
    "aiortc>=1.15.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
hebocon = "hebocon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hebocon"]

# CPU-Torch reicht und spart ~2 GB CUDA-Download; für GPU diesen Index tauschen.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
