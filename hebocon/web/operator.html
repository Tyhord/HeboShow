<!doctype html>
<!-- This code has been fully generated by an AI. -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hebocon Bedienung</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111418; color: #e8eaed; display: flex; height: 100vh; }
  #view { flex: 1; position: relative; background: #000; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  aside { width: 340px; padding: 14px; overflow-y: auto; border-left: 1px solid #2a2f36; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  section { background: #1a1f25; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; margin: 0; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 8px 10px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #30363d; }
  button.danger { background: #b62324; }
  button:disabled { opacity: .4; cursor: default; }
  input { background: #0d1117; color: #e8eaed; border: 1px solid #30363d; border-radius: 6px; padding: 7px; width: 100%; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  #message { background: #20262e; border-left: 4px solid #2d6cdf; padding: 8px; border-radius: 4px; min-height: 40px; }
  #status { font-size: 12px; color: #8b949e; line-height: 1.6; }
  .bad { color: #ff7b72; }
  kbd { background: #30363d; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  .hp { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas></div>
<aside>
  <h1>Hebocon Bedienung</h1>
  <div id="message"></div>
  <div id="status"></div>

  <section>
    <h2>Kamera</h2>
    <div class="row"><input id="source" placeholder="0, rtsp://… oder Datei"><button id="camera" class="secondary" style="flex:0">Übernehmen</button></div>
  </section>

  <section id="arenaBox">
    <h2>Arena (einmal pro Sitzung)</h2>
    <button id="corners" class="secondary">Ecken neu setzen</button>
    <button id="scan">Arena scannen (muss leer sein)</button>
  </section>

  <section id="battleBox">
    <h2>Kampf</h2>
    <button id="newBattle">Neuer Kampf <kbd>N</kbd></button>
    <div id="regBox" hidden>
      <div id="regTitle" style="font-weight:700;margin-bottom:6px"></div>
      <div class="row"><button id="detect">Erkennen <kbd>D</kbd></button><button id="retry" class="secondary">Nochmal <kbd>R</kbd></button></div>
      <div style="font-size:12px;color:#8b949e;margin:6px 0">Linksklick ins Bild: Fläche dazu. Rechtsklick: Fläche weg.</div>
      <input id="name" placeholder="Name des Roboters">
      <button id="confirm" style="margin-top:6px;width:100%">Bestätigen <kbd>Enter</kbd></button>
    </div>
    <button id="start" hidden>Start <kbd>S</kbd></button>
    <div id="fightBox" hidden>
      <div id="hp"></div>
      <div class="row" style="margin-top:6px"><button id="obstacle" class="secondary">Hindernis <kbd>O</kbd></button><button id="powerup" class="secondary">Power-up <kbd>P</kbd></button></div>
    </div>
    <button id="abort" class="danger" hidden>Kampf abbrechen</button>
  </section>
</aside>
<script type="module">
import { COLORS, act, connect, fit, hotkeys, pathPoly, resizeCanvas, toCanvas, toFrame } from "/web/common.js";

const $ = (id) => document.getElementById(id);
const canvas = $("c");
const ctx = canvas.getContext("2d");
let state = null;
let frame = null;
let view = null;
let cornerMode = false;
let corners = [];

async function run(name, data) {
  const res = await act(name, data);
  if (!res.ok) $("message").textContent = res.message;
}

$("camera").onclick = () => run("camera", { source: $("source").value.trim() });
$("corners").onclick = () => { cornerMode = true; corners = []; };
$("scan").onclick = () => run("scan");
$("newBattle").onclick = () => run("new_battle");
$("detect").onclick = () => run("detect");
$("retry").onclick = () => run("retry");
$("confirm").onclick = () => { run("confirm", { name: $("name").value }); $("name").value = ""; };
$("start").onclick = () => run("start");
$("obstacle").onclick = () => run("spawn", { kind: "obstacle" });
$("powerup").onclick = () => run("spawn", { kind: "powerup" });
$("abort").onclick = () => run("abort");
hotkeys(() => { const n = $("name").value; $("name").value = ""; return n; });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") { cornerMode = false; corners = []; } });

function click(e, positive) {
  e.preventDefault();
  if (!view || !state?.frame) return;
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const [x, y] = toFrame(view, (e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
  if (x < 0 || y < 0 || x > state.frame.w || y > state.frame.h) return;
  if (cornerMode) {
    corners.push([x, y]);
    if (corners.length === 4) {
      cornerMode = false;
      run("corners", { points: corners });
      corners = [];
    }
  } else if (state.phase === "register") {
    run("click", { x, y, positive });
  }
}
canvas.addEventListener("click", (e) => click(e, true));
canvas.addEventListener("contextmenu", (e) => click(e, false));

function ui(s) {
  $("message").textContent = cornerMode
    ? `Ecke ${corners.length + 1} von 4 anklicken (Esc bricht ab).`
    : (s.busy ? `⏳ ${s.busy} … ` : "") + (s.message || "");
  const cam = s.camera.error ? `<span class="bad">${s.camera.error}</span>` : `Kamera ${s.camera.source}: ${s.camera.fps} fps`;
  const model = s.model.error ? `<span class="bad">${s.model.error}</span>`
    : s.model.ready ? `EdgeTAM bereit (${s.model.device})` : `EdgeTAM lädt (${s.model.device}) …`;
  $("status").innerHTML = `${cam}<br>${model}<br>Phase: ${s.phase}`;
  if (document.activeElement !== $("source")) $("source").placeholder = s.camera.source;

  const p = s.phase;
  $("scan").disabled = !s.arena.corners.length;
  $("newBattle").disabled = !s.arena.scanned;
  $("regBox").hidden = p !== "register";
  if (s.register) $("regTitle").textContent = `Roboter ${s.register.slot} registrieren`;
  $("start").hidden = p !== "ready";
  $("fightBox").hidden = p !== "fight" && p !== "finished";
  $("abort").hidden = !["register", "ready", "fight", "finished"].includes(p);
  $("obstacle").disabled = $("powerup").disabled = p !== "fight";
  $("hp").innerHTML = s.robots.map((r) =>
    `<div class="hp" style="color:${COLORS[r.id]}"><span>${r.name}${r.outside ? " ⚠ draußen" : ""}${r.present ? "" : " (verloren)"}</span><span>${Math.ceil(r.hp)}</span></div>`).join("");
}

function draw() {
  resizeCanvas(canvas);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!state?.frame || !frame) return;
  view = fit(canvas, state.frame);
  const v = view;
  // Das Bild kann verkleinert gesendet sein; Koordinaten beziehen sich immer auf das Original.
  ctx.drawImage(frame, v.ox, v.oy, state.frame.w * v.s, state.frame.h * v.s);

  const pts = cornerMode ? corners : state.arena.corners;
  if (pts.length) {
    ctx.strokeStyle = "#ffd33d";
    ctx.lineWidth = 2;
    pathPoly(ctx, v, pts);
    if (pts.length === 4) ctx.stroke();
    pts.forEach((p) => {
      const [x, y] = toCanvas(v, p);
      ctx.fillStyle = "#ffd33d";
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    });
  }

  const shapes = [];
  state.confirmed.forEach((c) => shapes.push([c.contour, COLORS[c.slot], c.name]));
  if (state.register?.contour.length) shapes.push([state.register.contour, "#ffffff", "?"]);
  state.robots.forEach((r) => shapes.push([r.contour, COLORS[r.id], r.name]));
  for (const [contour, color, label] of shapes) {
    if (!contour.length) continue;
    pathPoly(ctx, v, contour);
    ctx.fillStyle = color + "55";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    const [x, y] = toCanvas(v, contour[0]);
    ctx.fillStyle = color;
    ctx.font = "bold 14px system-ui";
    ctx.fillText(label, x, y - 6);
  }
  for (const [x0, y0, positive] of state.register?.points || []) {
    const [x, y] = toCanvas(v, [x0, y0]);
    ctx.fillStyle = positive ? "#3fb950" : "#f85149";
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }
  for (const item of state.items) {
    pathPoly(ctx, v, item.poly);
    ctx.strokeStyle = item.kind === "obstacle" ? (item.armed ? "#f85149" : "#ffa657") : "#3fb950";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

connect((s, bitmap) => {
  state = s;
  if (bitmap) { frame?.close?.(); frame = bitmap; }
  ui(s);
  draw();
});
window.addEventListener("resize", draw);
</script>
</body>
</html>
