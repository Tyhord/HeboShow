<!doctype html>
<!-- This code has been fully generated by an AI. -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hebocon Bühne</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { COLORS, connect, hotkeys, pathPoly, resizeCanvas, toCanvas } from "/web/common.js";

const CROP_MARGIN = 0.08;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let state = null;
let frame = null;
let battle = -1;
let lastEvent = 0;
let effects = [];
let shownHp = {};
let shake = 0;
hotkeys();

function ingest(s) {
  if (s.battle !== battle) {
    // Neuer Kampf: Ereignis-IDs fangen neu an, alte Effekte verwerfen.
    battle = s.battle;
    lastEvent = Math.max(0, ...s.events.map((e) => e.id));
    effects = [];
    shownHp = {};
    return;
  }
  const now = performance.now();
  for (const e of s.events) {
    if (e.id <= lastEvent) continue;
    lastEvent = e.id;
    if (e.type === "collision" || e.type === "obstacle") {
      effects.push({ kind: "boom", pos: e.pos, t0: now, big: e.type === "obstacle" });
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `-${Math.round(e.amount)}`, color: COLORS[e.player], dy: e.player === 1 ? -30 : 30 });
      shake = Math.max(shake, e.type === "obstacle" ? 18 : 10);
    } else if (e.type === "powerup") {
      effects.push({ kind: "ring", pos: e.pos, t0: now, color: "#3fff8a" });
      effects.push({ kind: "text", pos: e.pos, t0: now, text: `+${Math.round(e.amount)}`, color: "#3fff8a", dy: -30 });
    } else if (e.type === "spawn") {
      effects.push({ kind: "ring", pos: e.pos, t0: now, color: e.kind === "obstacle" ? "#ff5c33" : "#3fff8a" });
    } else if (e.type === "ko") {
      shake = 25;
    }
  }
}

function drawRobot(v, r, t) {
  if (!r.contour.length) return;
  const color = COLORS[r.id];
  ctx.save();
  pathPoly(ctx, v, r.contour);
  ctx.shadowColor = color;
  ctx.shadowBlur = 25 + 10 * Math.sin(t / 200);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.globalAlpha = r.present ? 1 : 0.35;
  ctx.stroke();
  ctx.fillStyle = color + "44";
  ctx.fill();
  ctx.restore();
  if (r.outside && Math.floor(t / 250) % 2 === 0) {
    pathPoly(ctx, v, r.contour);
    ctx.fillStyle = "#ff000066";
    ctx.fill();
  }
  if (r.center) {
    const [x, y] = toCanvas(v, r.center);
    label(r.name, x, y - 12, color, 18);
  }
}

function label(text, x, y, color, size) {
  ctx.font = `800 ${size}px "Segoe UI", system-ui`;
  ctx.textAlign = "center";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#000";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawItem(v, item, t) {
  const [x, y] = toCanvas(v, item.center);
  ctx.save();
  if (item.kind === "obstacle") {
    // Blinkt, solange es noch nicht scharf ist, damit niemand unfair getroffen wird.
    const on = item.armed || Math.floor(t / 120) % 2 === 0;
    pathPoly(ctx, v, item.poly);
    ctx.shadowColor = "#ff3b1f";
    ctx.shadowBlur = item.armed ? 30 : 10;
    ctx.fillStyle = item.armed ? "#ff3b1fbb" : on ? "#ff9e1f66" : "#ff9e1f22";
    ctx.fill();
    ctx.strokeStyle = "#ffd0a0";
    ctx.lineWidth = 3;
    ctx.setLineDash(item.armed ? [] : [10, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    label("☠", x, y + 12, "#fff", 34);
  } else {
    const pulse = 1 + 0.08 * Math.sin(t / 150);
    ctx.translate(x, y);
    ctx.scale(pulse, pulse);
    ctx.translate(-x, -y);
    pathPoly(ctx, v, item.poly);
    ctx.shadowColor = "#3fff8a";
    ctx.shadowBlur = 30;
    ctx.fillStyle = "#3fff8a55";
    ctx.fill();
    ctx.strokeStyle = "#3fff8a";
    ctx.lineWidth = 3;
    ctx.stroke();
    label("✚", x, y + 12, "#fff", 34);
  }
  ctx.restore();
  if (item.ttl < 3) label(item.ttl.toFixed(0), x, y - 40, "#fff", 16);
}

function drawEffects(v, now) {
  effects = effects.filter((e) => now - e.t0 < 1200 && e.pos);
  for (const e of effects) {
    const k = (now - e.t0) / 1200;
    const [x, y] = toCanvas(v, e.pos);
    ctx.save();
    if (e.kind === "boom") {
      const r = (e.big ? 140 : 90) * v.s * Math.sqrt(k) + 10;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,255,220,${1 - k})`);
      g.addColorStop(0.4, `rgba(255,160,40,${0.8 * (1 - k)})`);
      g.addColorStop(1, "rgba(255,40,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === "ring") {
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(x, y, 20 + 120 * k * v.s, 0, Math.PI * 2); ctx.stroke();
    } else if (e.kind === "text") {
      ctx.globalAlpha = 1 - k * k;
      label(e.text, x, y + e.dy - 60 * k, e.color, 44 + 10 * (1 - k));
    }
    ctx.restore();
  }
}

function drawHud(s, now) {
  const W = canvas.width;
  const pad = 24;
  const bw = W * 0.38;
  s.robots.forEach((r, i) => {
    const color = COLORS[r.id];
    // Balken läuft der echten Zahl hinterher, damit Treffer sichtbar „abtropfen“.
    shownHp[r.id] = shownHp[r.id] === undefined ? r.hp : shownHp[r.id] + (r.hp - shownHp[r.id]) * 0.08;
    const x = i === 0 ? pad : W - pad - bw;
    const y = pad;
    ctx.fillStyle = "#000a";
    ctx.fillRect(x - 4, y - 4, bw + 8, 44);
    ctx.fillStyle = "#ffffff30";
    ctx.fillRect(x, y, bw * Math.max(0, shownHp[r.id]) / r.max_hp, 36);
    const frac = Math.max(0, r.hp) / r.max_hp;
    ctx.fillStyle = frac < 0.25 && Math.floor(now / 200) % 2 ? "#ff3030" : color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    const fw = bw * frac;
    ctx.fillRect(i === 0 ? x : x + bw - fw, y, fw, 36);
    ctx.shadowBlur = 0;
    ctx.textAlign = i === 0 ? "left" : "right";
    const tx = i === 0 ? x + 10 : x + bw - 10;
    ctx.font = '800 22px "Segoe UI"';
    ctx.fillStyle = "#fff";
    ctx.fillText(`${r.name}  ${Math.ceil(r.hp)}`, tx, y + 27);
    if (r.outside) {
      ctx.textAlign = i === 0 ? "left" : "right";
      label("RINGOUT!", i === 0 ? x + 80 : x + bw - 80, y + 80, "#ff3030", 30);
    }
  });
  label("VS", W / 2, pad + 30, "#fff", 30);
}

function arenaView(s) {
  // Fenster füllen; abgeschnitten wird höchstens der Rand, die Arena selbst bleibt ganz sichtbar.
  const xs = s.arena.corners.map((p) => p[0]);
  const ys = s.arena.corners.map((p) => p[1]);
  const aw = Math.max(...xs) - Math.min(...xs), ah = Math.max(...ys) - Math.min(...ys);
  const m = CROP_MARGIN * Math.max(aw, ah);
  const cw = canvas.width, ch = canvas.height;
  const sc = Math.min(Math.max(cw / (aw + 2 * m), ch / (ah + 2 * m)), cw / aw, ch / ah);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  return { s: sc, ox: cw / 2 - cx * sc, oy: ch / 2 - cy * sc, crop: [0, 0, cw, ch] };
}

function draw() {
  resizeCanvas(canvas);
  const now = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = state;
  if (!s?.frame || !frame) {
    label(s?.camera?.error || "Warte auf Kamera …", canvas.width / 2, canvas.height / 2, "#888", 28);
    requestAnimationFrame(draw);
    return;
  }
  if (!s.arena.scanned || s.arena.corners.length !== 4 || s.phase === "arena") {
    label("Kalibrierung …", canvas.width / 2, canvas.height / 2, "#888", 36);
    requestAnimationFrame(draw);
    return;
  }
  const v = arenaView(s);
  if (shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(...v.crop);
  ctx.clip();
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(frame, v.ox, v.oy, s.frame.w * v.s, s.frame.h * v.s);
  ctx.beginPath();
  ctx.rect(...v.crop);
  s.arena.corners.forEach((p, i) => {
    const [x, y] = toCanvas(v, p);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = "#000000b0";
  ctx.fill("evenodd");
  ctx.restore();
  pathPoly(ctx, v, s.arena.corners);
  ctx.save();
  ctx.shadowColor = "#7f5cff";
  ctx.shadowBlur = 20;
  ctx.strokeStyle = "#a08cffcc";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
  // Ab der Registrierung zeigen, damit das Publikum sieht, wer wer ist.
  if (s.phase !== "idle") s.robots.forEach((r) => drawRobot(v, r, now));
  if (s.phase === "fight" || s.phase === "finished") {
    s.items.forEach((i) => drawItem(v, i, now));
    drawEffects(v, now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHud(s, now);
    if (s.finished) {
      ctx.fillStyle = "#000a";
      ctx.fillRect(0, canvas.height / 2 - 90, canvas.width, 180);
      const w = s.robots.find((r) => r.name === s.winner);
      label(s.winner ? `${s.winner} GEWINNT!` : "UNENTSCHIEDEN", canvas.width / 2, canvas.height / 2 + 30,
        w ? COLORS[w.id] : "#fff", 80);
    }
  } else if (s.phase === "ready") {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    label(s.confirmed.map((c) => c.name).join("  VS  "), canvas.width / 2, canvas.height / 2, "#fff", 64);
  }
  requestAnimationFrame(draw);
}

connect((s, bitmap) => {
  ingest(s);
  state = s;
  if (bitmap) { frame?.close?.(); frame = bitmap; }
});
requestAnimationFrame(draw);
</script>
</body>
</html>
